[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "remotehub"
version = "0.3.1"
description = "Cross-platform remote control mapping and external dictation audio bridge"
requires-python = ">=3.12,<3.15"
dependencies = [
  # Intel Mac / macOS 13: 6.11.3 is the last PySide6 with macosx_13_0 wheels.
  "PySide6==6.11.3; sys_platform == 'darwin' and platform_machine == 'x86_64'",
  "PySide6==6.12.0; sys_platform != 'darwin' or platform_machine != 'x86_64'",
  "numpy>=1.26,<3", "pynput>=1.8,<2",
  "hidapi>=0.14,<1", "pyusb>=1.3,<2", "libusb-package>=1.0,<2",
  "platformdirs>=4,<5",
  "pyobjc-framework-Quartz>=10; sys_platform == 'darwin'",
  "evdev>=1.7,<3; sys_platform == 'linux'",
  "python-xlib>=0.33,<1; sys_platform == 'linux'",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-qt>=4,<5",
  "pyinstaller>=6.11,<7",
  "dmgbuild>=1.6,<2; sys_platform == 'darwin'",
]

[project.scripts]
remotehub = "remotehub.app:main"

[tool.setuptools.packages.find]
include = ["remotehub*"]

[tool.setuptools.package-data]
remotehub = ["branding.json", "assets/*.png", "assets/*.svg", "assets/*.json", "assets/*.txt", "models/*.json", "update-public.pem"]
"remotehub.codec" = ["COPYING.LGPLv2.1", "NOTICE.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
